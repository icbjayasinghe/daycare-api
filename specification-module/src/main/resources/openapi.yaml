          example: "INV-2026-11-001"
        enrollmentId:
          type: integer
          format: int64
          example: 101
          description: ID of the child's daycare enrollment.
        billingMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2026-11"
          description: Month covered by this invoice, in YYYY-MM format.
