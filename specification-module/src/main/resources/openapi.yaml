    DaycareStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - DEACTIVATED
      description: Request type
    EnrollmentStatus:
      type: string
      enum:
        - ACTIVE
        - ON_HOLD
        - WITHDRAWN
        - COMPLETED
      description: Enrollment type
    FundingType:
      type: string
      enum:
        - GOVERNMENT_REDUCTION
        - FAMILY_SUBSIDY
        - PROVIDER_GRANT
