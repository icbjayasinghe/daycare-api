    PaymentStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED
        - REVERSED

  requestBodies:
    ParentArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ParentDto'
      description: List of parent object
      required: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    daycare_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: 'http://daycare.swagger.io/oauth/dialog'
          scopes:
            'write:pets': modify pets in your account
            'read:pets': read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header