        notes:
          type: string
          nullable: true
          example: "November 2026 daycare invoice."
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - enrollmentId
        - billingMonth
        - issueDate
        - dueDate
        - grossAmount
        - status

