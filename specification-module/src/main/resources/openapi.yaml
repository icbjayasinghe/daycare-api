openapi: 3.0.0
info:
  description: |
    This is a daycare server.  You can find
    out more about Swagger at
    [http://swagger.io](http://swagger.io) or on
    [irc.freenode.net, #swagger](http://swagger.io/irc/).
  version: 1.0.0
  title: Swagger Daycare
  termsOfService: 'http://swagger.io/terms/'
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - description: SwaggerHub API Auto Mocking
    url: 'https://virtserver.swaggerhub.com/skyhigh-00b/DaycareAPI/1.0.0'
  - url: 'https://daycare.swagger.io/v2'
tags:
  - name: User
    description: Operations common for all users

  - name: DayCareOwner
    description: Operations about daycare owner

  - name: Daycare
    description: Daycare operations

  - name: Parent
    description: Operations about parent

  - name: Child
    description: Operations about child

    externalDocs:
      description: Find out more about our daycare
      url: 'http://swagger.io'

paths:
  /user/login:
    post:
      tags:
        - User
      summary: Logs user into the system
      operationId: loginUser
      requestBody:
        description: Parent object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                status: 403
                message: Account disabled
  /user/logout:
    get:
      tags:
        - User
      summary: Logs out current logged in parent session
      operationId: logoutUser
      responses:
        default:
          description: successful operation

  /parent:
    post:
      tags:
        - Parent
      summary: Create parent
      description: This can be done by parent themself.
      operationId: createParent
      requestBody:
        description: Parent object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Parent
      summary: Edit parent
      description: This can be done by admin or Parent
      operationId: editParent
      requestBody:
        description: Created parent object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Parent
      summary: Get Parent list
      description: This can be done by admin only
      operationId: listParents
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
  /parent/{id}:
    get:
      tags:
        - Parent
      summary: Get parent by id
      description: This can be done by respective user or admin
      operationId: getParent
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 46
          required: true
          description: Numeric ID of the parent to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - Parent
      summary: Delete Parent by id
      description: This can be done only by admin after receiving a written request from the parent
      operationId: deleteParent
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 46
          required: true
          description: Numeric ID of the parent to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
  /parent/byEmail/{email}:
    get:
      tags:
        - Parent
      summary: Get parent by email
      description: This can be done by respective user or admin
      operationId: getParentByEmail
      parameters:
        - in: path
          name: email
          schema:
            type: string
            example: peter@gmail.com
          required: true
          description: Email of the parent to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
  /parent/byChildId/{id}:
    get:
      tags:
        - Parent
      summary: Get parent by child id
      description: This can be done by respective user or admin
      operationId: getParentByChildId
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
            example: 123
          required: true
          description: ID of the child to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed

  /child:
    post:
      tags:
        - Child
      summary: Create child
      description: This can be done by parent.
      operationId: createChild
      requestBody:
        description: Child object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Child
      summary: Edit Child
      description: This can be done by parent
      operationId: editChild
      requestBody:
        description: Created child object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Child
      summary: Get child list
      description: This can be done by admin, parent, or daycare user
      operationId: listChildren
      parameters:
        - in: query
          name: loggedInParentId
          required: false
          description: If logged in user is a parent, they can view only their children.
          schema:
            type: integer
            example: 91
        - in: query
          name: loggedInDayCareId
          required: false
          description: If logged in user is a daycare, they can view only children in their daycare.
          schema:
            type: integer
            example: 92
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
  /child/byEmail/{parentEmail}:
    parameters:
      - in: path
        name: parentEmail
        schema:
          type: string
          example: peter@gmail.com
        required: true
        description: Parent email associated with the child.

    post:
      tags:
        - Child
      summary: Create child
      description: This can be done by parent.
      operationId: createChildByParent
      requestBody:
        description: Child object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed

    put:
      tags:
        - Child
      summary: Edit Child
      description: This can be done by parent.
      operationId: editChildByParent
      requestBody:
        description: Updated child object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed

    get:
      tags:
        - Child
      summary: Get child list
      description: This can be done by admin, parent, or daycare user.
      operationId: listChildrenByParent
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
  /child/{id}:
    get:
      tags:
        - Child
      summary: Get child by id
      description: This can be done by respective parent, daycare user, or admin
      operationId: getChild
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 38
          required: true
          description: Numeric ID of the child to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - Child
      summary: Delete Child by id
      description: This can be done only by parent
      operationId: deleteChild
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 38
          required: true
          description: Numeric ID of the child to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
  /child/byEmail/{parentEmail}/request/{daycareId}:
    parameters:
      - in: path
        name: parentEmail
        schema:
          type: string
          example: peter@gmail.com
        required: true
        description: Parent email associated with the child.
      - in: path
        name: daycareId
        schema:
          type: integer
          format: int64
        required: true
        description: Parent email associated with the child.

    post:
      tags:
        - Child
      summary: Daycare request by child
      description: This can be done by parent.
      operationId: daycareRequestByParent
      requestBody:
        description: Child's request object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildRequestDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareApplicationDto'
        '400':
          description: Operation failed

  /daycareOwner:
    post:
      tags:
        - DayCareOwner
      summary: Create new daycare owner/ admin
      description: This can be done by system admin only
      operationId: createDayCareOwner
      requestBody:
        description: Created daycare owner object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed
    put:
      tags:
        - DayCareOwner
      summary: Edit daycare admin
      description: This can be done by admin or Daycare owner
      operationId: editDayCareOwner
      requestBody:
        description: Created DayCareOwner object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed
    get:
      tags:
        - DayCareOwner
      summary: Get Daycare owners list
      description: This can be done by admin only
      operationId: listDayCareOwners
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
  /daycareOwner/{id}:
    get:
      tags:
        - DayCareOwner
      summary: Get daycare owner by id
      description: This can be done by admin or owner only
      operationId: getDayCareOwner
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 101
          required: true
          description: Numeric ID of the daycare owner to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - DayCareOwner
      summary: Delete daycare owner by id
      description: This can be done only by admin after receiving a written request from the daycare owner
      operationId: deleteDayCareOwner
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 102
          required: true
          description: Numeric ID of the daycare owner to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed

  /daycare:
    post:
      tags:
        - Daycare
      summary: Create new daycare
      description: This can be done by admin only
      operationId: createDayCare
      requestBody:
        description: Created daycare object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Daycare
      summary: Edit daycare
      description: This can be done by admin or Daycare owner
      operationId: editDayCare

      security:
        - bearerAuth: []

      requestBody:
        description: Created daycare object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Daycare
      summary: Get daycare list
      description: This can be done by any user
      operationId: listDayCares
      parameters:
        - name: keyword
          in: query
          description: Search keyword (searches name, description, etc.)
          required: false
          schema:
            type: string
            example: "Daycare name"
        - name: latitude
          in: query
          description: Latitude of the center point
          required: false
          schema:
            type: number
            format: float
            example: 43.7615

        - name: longitude
          in: query
          description: Longitude of the center point
          required: false
          schema:
            type: number
            format: float
            example: -79.4111

        - name: radius
          in: query
          description: Search radius in kilometers from the center point
          required: false
          schema:
            type: number
            format: float
            default: 10
            example: 25
        - name: status
          in: query
          description: Search by status
          required: false
          schema:
            $ref: '#/components/schemas/DaycareStatus'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed

  /daycare/{id}:
    get:
      tags:
        - Daycare
      summary: Get daycare by id
      description: This can be done by any user
      operationId: getDayCare
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 205
          required: true
          description: Numeric ID of the daycare to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - Daycare
      summary: Delete daycare by id
      description: This can be done only by admin after receiving a written request from the daycare owner
      operationId: deleteDayCare
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 206
          required: true
          description: Numeric ID of the daycare to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed

  /daycare/byOwner/{email}:
    get:
      tags:
        - Daycare
      summary: Get daycare by owner
      description: This can be done by owner
      operationId: getDayCareByEmail
      parameters:
        - in: path
          name: email
          schema:
            type: string
            example: 205
          required: true
          description: Owner of the daycare
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed

  /application:
    post:
      tags:
        - Application
      summary: Create application
      description: This can be done by parent.
      operationId: createApplication
      requestBody:
        description: Application object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildRequestDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareApplicationDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Application
      summary: Edit Application
      description: This can be done by parent or daycare provider
      operationId: editApplication
      requestBody:
        description: Created application object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareApplicationDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareApplicationDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Application
      summary: Get all application list
      description: This can be done by admin, parent, or daycare user
      operationId: getApplicationList
      parameters:
        - in: query
          name: loggedInParentEmail
          required: false
          description: If logged in user is a parent, they can view only their children.
          schema:
            type: string
            example: peter@gmail.com
        - in: query
          name: loggedInDayCareEmail
          required: false
          description: If logged in user is a daycare, they can view only children in their daycare.
          schema:
            type: string
            example: peter@gmail.com
        - in: query
          name: status
          required: false
          description: Filter accourding to status
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayCareApplicationDto'
        '400':
          description: Operation failed

  /enrollment:
    post:
      tags:
        - Enrollment
      summary: Create application
      description: This can be done by daycare.
      operationId: createEnrollment
      requestBody:
        description: Enrollment object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareEnrollmentDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareEnrollmentDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Enrollment
      summary: Edit Enrollment
      description: This can be done by parent or daycare provider
      operationId: editEnrollment
      requestBody:
        description: Created enrollment object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareEnrollmentDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareEnrollmentDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Enrollment
      summary: Get enrollment list
      description: This can be done by admin, parent, or daycare user
      operationId: getEnrollmentList
      parameters:
        - in: query
          name: loggedInParentEmail
          required: false
          description: If logged in user is a parent, they can view only their children.
          schema:
            type: string
            example: peter@gmail.com
        - in: query
          name: loggedInDayCareEmail
          required: false
          description: If logged in user is a daycare, they can view only children in their daycare.
          schema:
            type: string
            example: peter@gmail.com
        - in: query
          name: status
          required: false
          description: Filter accourding to status
          schema:
            $ref: '#/components/schemas/EnrollmentStatus'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayCareEnrollmentDto'
        '400':
          description: Operation failed

  /daycare/{email}/dashboard:
    get:
      tags:
        - Daycare Dashboard
      summary: Get daycare provider dashboard
      description: Retrieve dashboard statistics and recent applications for a daycare.
      operationId: getDaycareDashboard
      parameters:
        - name: email
          in: path
          required: true
          description: Unique identifier of the daycare
          schema:
            type: string
            example: peter@gmail.com
      responses:
        '200':
          description: Dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaycareDashboardDto'
        '401':
          description: Unauthorized
        '403':
          description: Access denied
        '404':
          description: Daycare not found
        '500':
          description: Internal server error

  /fee-plans:
    post:
      tags:
        - Payment
      summary: Create a new fee plan
      operationId: createFeePlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeePlanDto'
      responses:
        '201':
          description: Fee plan created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeePlanDto'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Daycare not found
        '409':
          description: Fee plan conflict
    get:
      tags:
        - Payment
      summary: Get all fee plans
      operationId: getFeePlans
      parameters:
        - name: daycareId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter fee plans by daycare ID
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter fee plans by active status
      responses:
        '200':
          description: Fee plans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeePlanDto'
        '401':
          description: Unauthorized
  /fee-plans/{feePlanId}:
    get:
      tags:
        - Payment
      summary: Get fee plan by ID
      operationId: getFeePlanById
      parameters:
        - name: feePlanId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Fee plan retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeePlanDto'
        '404':
          description: Fee plan not found

    put:
      tags:
        - Payment
      summary: Update an existing fee plan
      operationId: updateFeePlan
      parameters:
        - name: feePlanId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeePlanDto'
      responses:
        '200':
          description: Fee plan updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeePlanDto'
        '400':
          description: Invalid request
        '404':
          description: Fee plan not found
        '409':
          description: Fee plan conflict

    delete:
      tags:
        - Payment
      summary: Delete a fee plan
      operationId: deleteFeePlan
      parameters:
        - name: feePlanId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Fee plan deleted successfully
        '404':
          description: Fee plan not found
        '409':
          description: Fee plan is already assigned to an enrollment



