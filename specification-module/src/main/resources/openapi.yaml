openapi: 3.0.0
info:
  description: |
    This is a daycare server.  You can find
    out more about Swagger at
    [http://swagger.io](http://swagger.io) or on
    [irc.freenode.net, #swagger](http://swagger.io/irc/).
  version: 1.0.0
  title: Swagger Daycare
  termsOfService: 'http://swagger.io/terms/'
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - description: SwaggerHub API Auto Mocking
    url: 'https://virtserver.swaggerhub.com/skyhigh-00b/DaycareAPI/1.0.0'
  - url: 'https://daycare.swagger.io/v2'
tags:
  - name: User
    description: Operations common for all users

  - name: DayCareOwner
    description: Operations about daycare owner

  - name: Daycare
    description: Daycare operations

  - name: Parent
    description: Operations about parent

  - name: Child
    description: Operations about child

    externalDocs:
      description: Find out more about our daycare
      url: 'http://swagger.io'

paths:
  /user/login:
    post:
      tags:
        - User
      summary: Logs user into the system
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: The user email for login
          required: true
          schema:
            type: string
        - name: password
          in: query
          description: The password for login in clear text/ hashed from the UI
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the parent
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
        '400':
          description: Invalid parentname/password supplied
  /user/logout:
    get:
      tags:
        - User
      summary: Logs out current logged in parent session
      operationId: logoutUser
      responses:
        default:
          description: successful operation

  /parent:
    post:
      tags:
        - Parent
      summary: Create parent
      description: This can be done by parent themself.
      operationId: createParent
      requestBody:
        description: Parent object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Parent
      summary: Edit parent
      description: This can be done by admin or Parent
      operationId: editParent
      requestBody:
        description: Created parent object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Parent
      summary: Get Parent list
      description: This can be done by admin only
      operationId: listParents
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
  /parent/{id}:
    get:
      tags:
        - Parent
      summary: Get parent by id
      description: This can be done by respective user or admin
      operationId: getParent
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 46
          required: true
          description: Numeric ID of the parent to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - Parent
      summary: Delete Parent by id
      description: This can be done only by admin after receiving a written request from the parent
      operationId: deleteParent
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 46
          required: true
          description: Numeric ID of the parent to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed

  /child:
    post:
      tags:
        - Child
      summary: Create child
      description: This can be done by parent.
      operationId: createChild
      requestBody:
        description: Child object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Child
      summary: Edit Child
      description: This can be done by parent
      operationId: editChild
      requestBody:
        description: Created child object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Child
      summary: Get child list
      description: This can be done by admin, parent, or daycare user
      operationId: listChildren
      parameters:
        - in: query
          name: loggedInParentId
          required: false
          description: If logged in user is a parent, they can view only their children.
          schema:
            type: integer
            example: 91
        - in: query
          name: loggedInDayCareId
          required: false
          description: If logged in user is a daycare, they can view only children in their daycare.
          schema:
            type: integer
            example: 92
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
  /child/{id}:
    get:
      tags:
        - Child
      summary: Get child by id
      description: This can be done by respective parent, daycare user, or admin
      operationId: getChild
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 38
          required: true
          description: Numeric ID of the child to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - Child
      summary: Delete Child by id
      description: This can be done only by parent
      operationId: deleteChild
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 38
          required: true
          description: Numeric ID of the child to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDto'
        '400':
          description: Operation failed

  /daycareOwner:
    post:
      tags:
        - DayCareOwner
      summary: Create new daycare owner/ admin
      description: This can be done by system admin only
      operationId: createDayCareOwner
      requestBody:
        description: Created daycare owner object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed
    put:
      tags:
        - DayCareOwner
      summary: Edit daycare admin
      description: This can be done by admin or Daycare owner
      operationId: editDayCareOwner
      requestBody:
        description: Created DayCareOwner object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed
    get:
      tags:
        - DayCareOwner
      summary: Get Daycare owners list
      description: This can be done by admin only
      operationId: listDayCareOwners
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
  /daycareOwner/{id}:
    get:
      tags:
        - DayCareOwner
      summary: Get daycare owner by id
      description: This can be done by admin or owner only
      operationId: getDayCareOwner
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 101
          required: true
          description: Numeric ID of the daycare owner to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - DayCareOwner
      summary: Delete daycare owner by id
      description: This can be done only by admin after receiving a written request from the daycare owner
      operationId: deleteDayCareOwner
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 102
          required: true
          description: Numeric ID of the daycare owner to get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDto'
        '400':
          description: Operation failed

  /daycare:
    post:
      tags:
        - Daycare
      summary: Create new daycare
      description: This can be done by admin only
      operationId: createDayCare
      requestBody:
        description: Created daycare object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareDto'
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
    put:
      tags:
        - Daycare
      summary: Edit daycare
      description: This can be done by admin or Daycare owner
      operationId: editDayCare
      requestBody:
        description: Created daycare object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCareDto'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
    get:
      tags:
        - Daycare
      summary: Get daycare list
      description: This can be done by any user
      operationId: listDayCares
      parameters:
        - name: keyword
          in: query
          description: Search keyword (searches name, description, etc.)
          required: false
          schema:
            type: string
            example: "Daycare name"
        - name: latitude
          in: query
          description: Latitude of the center point
          required: false
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
            example: 43.7615

        - name: longitude
          in: query
          description: Longitude of the center point
          required: false
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
            example: -79.4111

        - name: radius
          in: query
          description: Search radius in kilometers from the center point
          required: false
          schema:
            type: number
            format: float
            minimum: 0.1
            maximum: 100
            default: 10
            example: 25
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed

  /daycare/{id}:
    get:
      tags:
        - Daycare
      summary: Get daycare by id
      description: This can be done by any user
      operationId: getDayCare
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 205
          required: true
          description: Numeric ID of the daycare to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed
    delete:
      tags:
        - Daycare
      summary: Delete daycare by id
      description: This can be done only by admin after receiving a written request from the daycare owner
      operationId: deleteDayCare
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            example: 206
          required: true
          description: Numeric ID of the daycare to delete
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCareDto'
        '400':
          description: Operation failed


externalDocs:
  description: Find out more about Swagger
  url: 'http://swagger.io'
components:
  schemas:
    UserTypes:
      type: string
      enum: [ admin, daycareOwner, daycareAssistant, parent, child ]
    ParentDto:
      type: object
      xml:
        name: Parent
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        parentStatus:
          type: integer
          format: int32
          description: Parent Status
        address:
          $ref: '#/components/schemas/AddressDto'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildDto'
    OwnerDto:
      type: object
      description: Daycare owner
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        userType:
          $ref: '#/components/schemas/UserTypes'
    DayCareDto:
      type: object
      description: Day care DTO
      properties:
        name:
          type: string
        telephone:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/OwnerDto'
        address:
          $ref: '#/components/schemas/AddressDto'
    AddressDto:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
      description: Address model
    ChildDto:
      type: object
      title: Child
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
          x-stoplight:
            id: 5jgf9il2bnqyr
        lastName:
          type: string
          x-stoplight:
            id: 6h9e65ovml6y5
        dob:
          type: string
          x-stoplight:
            id: mq68bbd8e6itx
        sex:
          type: string
          x-stoplight:
            id: pg64mdmyc60m3
      description: ''
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

  requestBodies:
    ParentArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ParentDto'
      description: List of parent object
      required: true
  securitySchemes:
    daycare_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: 'http://daycare.swagger.io/oauth/dialog'
          scopes:
            'write:pets': modify pets in your account
            'read:pets': read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header