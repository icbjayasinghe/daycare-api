        dueDate:
          type: string
          format: date
          example: "2026-11-10"
        grossAmount:
          type: number
          format: double
          example: 1000.00
          description: Original daycare fee before funding and adjustments.
        totalFundingAmount:
          type: number
          format: double
          readOnly: true
          example: 450.00
          description: Total funding applied to this invoice.
        otherAdjustmentAmount:
          type: number
          format: double
          example: 0.00
          description: Other credits or additional charges applied to the invoice. Positive values increase the amount due.
        parentAmountDue:
          type: number
          format: double
          readOnly: true
          example: 550.00
          description: Final amount payable by the parent after funding and adjustments.
        totalPaid:
          type: number
          format: double
          readOnly: true
          example: 300.00
          description: Total payments received from the parent.
        balanceDue:
          type: number
          format: double
          readOnly: true
          example: 250.00
          description: Remaining amount payable by the parent.
        status:
          $ref: '#/components/schemas/InvoiceStatus'
