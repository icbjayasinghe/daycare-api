        referenceNumber:
          type: string
          nullable: true
          example: "CWELCC-2026-001"
          description: External funding reference number, if applicable.
        notes:
          type: string
          nullable: true
          example: "Government fee reduction for November 2026."
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - invoiceId
        - fundingProgramId
        - allocationType
        - amount
        - status
    PaymentTransactionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        enrollmentId:
          type: integer
          format: int64
          description: ID of the child enrollment associated with this payment
        payerType:
          $ref: '#/components/schemas/PayerType'
          description: Identifies who made the payment
        amount:
          type: number
          format: double
          description: Actual amount received
          example: 500.00
        paymentDate:
          type: string
          format: date
          description: Date the payment was received
          example: "2026-11-05"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        referenceNumber:
          type: string
          nullable: true
          description: Bank transaction ID, cheque number, or payment reference
          example: "BANK-2026-00125"
        status:
          $ref: '#/components/schemas/PaymentStatus'
          description: Current payment transaction status
      required:
        - enrollmentId
        - payerType
        - amount
        - paymentDate
        - paymentMethod
        - status

    PaymentAllocationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Unique payment allocation ID
        paymentId:
          type: integer
          format: int64
          description: ID of the payment transaction
        invoiceId:
          type: integer
          format: int64
          description: ID of the monthly invoice
        allocatedAmount:
          type: number
          format: double
          description: Amount of the payment allocated to this invoice
          example: 300.00
      required:
        - paymentId
        - invoiceId
        - allocatedAmount

    ApiResponse:
      type: object
